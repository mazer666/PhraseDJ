# PhraseDJ — default keyboard map (English QWERTY).
#
# The user copy lives in the app-support folder and is regenerated by
# the Settings UI when remapped.  Any key not listed here is unbound.
# Modifier syntax: "Ctrl+Shift+F", "Cmd+L", "Alt+1".
#
# Intent string format:
#   <namespace>.<scope>.<action>[.argument]
# Examples: "deck.A.toggle_play", "mixer.crossfader.set:0.5"

[keymap]
# Deck A — left-hand side.
"Q"     = "deck.A.toggle_play"
"W"     = "deck.A.cue"
"E"     = "deck.A.sync"
"1"     = "deck.A.tempo_nudge_minus"
"2"     = "deck.A.tempo_nudge_plus"
"A"     = "deck.A.loop_in"
"S"     = "deck.A.loop_out"
"Z"     = "deck.A.stem_mute_vocals"
"X"     = "deck.A.stem_mute_drums"
"C"     = "deck.A.stem_mute_bass"
"V"     = "deck.A.stem_mute_other"

# Deck B — right-hand side.
"P"     = "deck.B.toggle_play"
"O"     = "deck.B.cue"
"I"     = "deck.B.sync"
"8"     = "deck.B.tempo_nudge_minus"
"9"     = "deck.B.tempo_nudge_plus"
"K"     = "deck.B.loop_in"
"L"     = "deck.B.loop_out"
"M"     = "deck.B.stem_mute_vocals"
","     = "deck.B.stem_mute_drums"
"."     = "deck.B.stem_mute_bass"
"/"     = "deck.B.stem_mute_other"

# Global.
"Space"  = "master.pause_toggle"
"F"      = "view.toggle_fullscreen"
"Ctrl+L" = "view.focus_library_search"
"Ctrl+," = "view.open_settings"
"Esc"    = "view.close_modal"
"Y"      = "view.lyrics_cycle"
"T"      = "macro.trigger_transition"
"R"      = "macro.toggle_record"
