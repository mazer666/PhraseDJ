# cargo-deny configuration for PhraseDJ.
# Audits dependencies for license compatibility with MPL-2.0.

[licenses]
# Allow licences compatible with MPL-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "Zlib",
]

[advisories]
# unmaintained crates are silently skipped; yanked versions are denied.
unmaintained = "none"
yanked = "deny"
