[package]
name        = "pdj-engine-bridge"
version     = "0.0.1"
edition     = "2021"
license     = "MIT"
description = "Safe Rust facade over the C++ pdj_audio engine"
build       = "build.rs"

[dependencies]
pdj-core  = { path = "../pdj-core" }
serde     = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }

[dev-dependencies]
tempfile = "3"
criterion = "0.5.1"

[[bench]]
name = "latency"
harness = false
