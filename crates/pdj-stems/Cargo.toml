[package]
name        = "pdj-stems"
version     = "0.0.1"
edition     = "2021"
description = "AI stem separation (HTDemucs) for PhraseDJ"

[dependencies]
pdj-core   = { path = "../pdj-core" }
serde      = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
tokio      = { workspace = true }
uuid       = { workspace = true }

# Async broadcast channel (multi-producer, multi-consumer).
# Used by the job queue to push status events to subscribers.
async-broadcast = { workspace = true }

# Number of logical / performance CPU cores – used to cap parallel jobs.
num_cpus = { workspace = true }

# WAV/FLAC writing for stem output files.
# Phase 2: writes WAV; will switch to FLAC encoder when packaged.
hound = { workspace = true }

# Audio decoding for loading PCM data
symphonia = { version = "0.5", features = ["all"] }

# ONNX Runtime bindings for cross-platform inference fallback.
ort = "2.0"
ndarray = "0.15"

# HTTP client for model downloading.
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# MLX framework bindings for Apple Silicon acceleration.
mlx-rs = "0.2"

[dev-dependencies]
tempfile = "3"
tokio    = { workspace = true }
